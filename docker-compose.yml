version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-studio-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage:/storage
    depends_on:
      - redis

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -lc "npm install && npm run dev"
    container_name: ai-studio-frontend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ai-studio-redis
    ports:
      - "6379:6379"

  worker:
    image: python:3.11-slim
    working_dir: /app
    container_name: ai-studio-worker
    command: sh -lc "pip install celery redis && celery -A workers.celery_app worker --loglevel=info"
    volumes:
      - .:/app
    depends_on:
      - redis
